name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: Shot2Photos.xcodeproj
  SCHEME: Shot2Photos
  APP_NAME: Shot2Photos

jobs:
  release:
    # Xcode 27 is required for the AppIconFile.icon Icon Composer resource.
    runs-on: xcode-27

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Release tags must look like v1.0 or v1.0.0; received $GITHUB_REF_NAME" >&2
            exit 1
          fi

          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Import Developer ID certificate
        shell: bash
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          keychain_path="$RUNNER_TEMP/shot2photos-build.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"

          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          security find-identity -v -p codesigning "$keychain_path"

      - name: Archive
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          archive_path="$RUNNER_TEMP/Shot2Photos.xcarchive"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$archive_path" \
            archive \
            MARKETING_VERSION="$RELEASE_VERSION" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            'CODE_SIGN_IDENTITY[sdk=macosx*]=Developer ID Application' \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Export signed app
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          archive_path="$RUNNER_TEMP/Shot2Photos.xcarchive"
          export_path="$RUNNER_TEMP/Shot2Photos-export"
          export_options="$RUNNER_TEMP/ExportOptions.plist"

          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>developer-id</string>
              <key>signingCertificate</key>
              <string>Developer ID Application</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options"

          test -d "$export_path/$APP_NAME.app"

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          export_path="$RUNNER_TEMP/Shot2Photos-export"
          dmg_root="$RUNNER_TEMP/Shot2Photos-dmg-root"
          dist_path="$GITHUB_WORKSPACE/dist"
          dmg_path="$dist_path/$APP_NAME-$RELEASE_VERSION.dmg"

          rm -rf "$dmg_root"
          mkdir -p "$dmg_root" "$dist_path"
          ditto "$export_path/$APP_NAME.app" "$dmg_root/$APP_NAME.app"
          ln -s /Applications "$dmg_root/Applications"

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$dmg_root" \
            -ov \
            -format UDZO \
            "$dmg_path"

          test -f "$dmg_path"

      - name: Notarize and staple DMG
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          dmg_path="$GITHUB_WORKSPACE/dist/$APP_NAME-$RELEASE_VERSION.dmg"

          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 -D > "$api_key_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --output-format json

          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"

      - name: Verify notarized app inside DMG
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="$GITHUB_WORKSPACE/dist/$APP_NAME-$RELEASE_VERSION.dmg"
          mount_point="$RUNNER_TEMP/shot2photos-mounted-dmg"

          mkdir -p "$mount_point"
          hdiutil attach "$dmg_path" -nobrowse -noverify -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet' EXIT
          spctl --assess --type execute --verbose=4 "$mount_point/$APP_NAME.app"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/$APP_NAME-$RELEASE_VERSION.dmg" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Clean up signing material
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          security delete-keychain "$RUNNER_TEMP/shot2photos-build.keychain-db"
          rm -f \
            "$RUNNER_TEMP/developer-id-application.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8
